<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":556,"height":762}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const look = (on) => ({
      bg: on ? 'rgba(96,72,173,0.12)' : 'rgba(255,255,255,0.80)', bd: on ? '#6048AD' : 'rgba(59,51,49,0.30)',
      fg: on ? '#5A469B' : '#141414', ck: on ? 'block' : 'none',
    });
    const save = (patch) => {
      this.setState(Object.assign({ saving: true }, patch));
      clearTimeout(this._t);
      this._t = setTimeout(() => this.setState({ saving: false }), 700);
    };
    const sel = s.sel || { h: { 'Solenne Collection': true, 'Meridian Hotels': true }, a: { 'Coast Air': true }, v: { 'Grand Opera House': true }, r: { 'Osteria Lume': true } };
