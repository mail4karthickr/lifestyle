<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":488,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const budget = s.budget || '$200–300';
    const vibe = s.vibe || { Lively: true };
    const dining = s.dining || { Italian: true, "Chef's table": true };
    const look = (on) => ({
      bg: on ? 'rgba(96,72,173,0.12)' : 'rgba(255,255,255,0.78)',
      bd: on ? '#6048AD' : 'rgba(59,51,49,0.30)',
      fg: on ? '#5A469B' : '#141414',
      ck: on ? 'block' : 'none',
    });
    const budgets = ['Under $200', '$200–300', '$300+'].map((b) => Object.assign({ label: b, on: b === budget, pick: () => this.setState({ budget: b }) }, look(b === budget)));
    const multi = (names, cur, key) => names.map((n) => Object.assign({
      label: n, on: !!cur[n],
      pick: () => { const c = Object.assign({}, cur); c[n] = !cur[n]; const o = {}; o[key] = c; this.setState(o); },
    }, look(!!cur[n])));
    const join = (cur) => Object.keys(cur).filter((k) => cur[k]).join(', ') || 'Any';
    return {
      budgets: budgets,
      vibes: multi(['Lively', 'Quiet', 'Romantic'], vibe, 'vibe'),
      dinings: multi(['Italian', "Chef's table", 'Seafood'], dining, 'dining'),
      budgetText: budget + ' a night',
      vibeText: join(vibe),
      diningText: join(dining),
    };
  }
}
</script>
